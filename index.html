<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>SpiderBot Controller</title>
<style>
:root{--bg:#101010;--panel:#1a1a1a;--red:#ed1c24;--white:#f5f5f5;--muted:#969696;--line:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:16px}
.wrap{max-width:520px;margin:0 auto}.header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}.brand{font-size:23px;font-weight:900;letter-spacing:1px}.brand span{color:var(--red)}.sub{color:var(--muted);font-size:11px;letter-spacing:2px;margin-top:3px}
button{color:white;border:1px solid var(--line);background:#242424;border-radius:12px;font-weight:700;cursor:pointer;touch-action:manipulation;user-select:none}button:active{transform:scale(.98);filter:brightness(1.2)}.connect{background:var(--red);border:0;padding:12px 14px;border-radius:10px}.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin:0 0 14px}.dot{width:9px;height:9px;border-radius:50%;background:#777}.dot.connected{background:#35d07f;box-shadow:0 0 9px #35d07f66}
.card{background:var(--panel);border:1px solid #292929;border-radius:18px;padding:15px;margin-bottom:13px}.section-title{font-size:12px;color:#aaa;letter-spacing:1.6px;font-weight:800;margin:0 0 12px}.control-layout{display:grid;grid-template-columns:1fr;gap:13px;align-items:center}.direction-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:340px;margin:0 auto}.direction-pad button{padding:12px 4px;min-height:62px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none}.direction-pad button .arrow{font-size:24px;line-height:1}.direction-pad .empty{visibility:hidden}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.buttons button{padding:13px 4px;min-height:46px;font-size:13px}.buttons .wide{grid-column:span 2}.buttons .accent{border-color:#a91016;color:#ff555b;background:#2a1718}
.slider-row{display:flex;align-items:center;gap:12px}.slider-row input{width:100%;accent-color:var(--red)}.speed-value{min-width:38px;text-align:right;font-weight:800;color:#ff555b}.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom-grid button{padding:15px 8px}.servo{background:#333}.stop{background:var(--red);border:0;font-size:18px;padding:18px!important;grid-column:span 2;letter-spacing:1px}.note{color:#777;font-size:10px;text-align:center;line-height:1.5;margin:12px 4px 2px}
@media(max-width:370px){body{padding:12px}.direction-pad button{min-height:54px}.buttons button{min-height:42px;padding:10px 3px}}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><div><div class="brand">SPIDER<span>BOT</span></div><div class="sub">WIRELESS CONTROL PANEL</div></div><button class="connect" id="connectBtn">CONNECT BLE</button></header>
<div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Disconnected</span></div>
<section class="card"><div class="section-title">MANUAL MOVEMENT</div><div class="control-layout"><div class="direction-pad"><button class="empty" aria-hidden="true" tabindex="-1">&nbsp;</button><button class="direction" data-move="forward"><span class="arrow">↑</span>FORWARD</button><button class="empty" aria-hidden="true" tabindex="-1">&nbsp;</button><button class="direction" data-move="turn_left"><span class="arrow">←</span>LEFT</button><button id="stopPadBtn" class="accent"><span class="arrow">■</span>STOP</button><button class="direction" data-move="turn_right"><span class="arrow">→</span>RIGHT</button><button class="empty" aria-hidden="true" tabindex="-1">&nbsp;</button><button class="direction" data-move="backward"><span class="arrow">↓</span>BACKWARD</button><button class="empty" aria-hidden="true" tabindex="-1">&nbsp;</button></div><div class="buttons"><button data-action="stand">STAND</button><button data-action="sit">SIT</button><button data-action="wave">WAVE</button><button data-action="dance">DANCE</button><button data-action="reset">RESET</button></div></div></section>
<section class="card"><div class="section-title">MOVEMENT SPEED</div><div class="slider-row"><input id="speed" type="range" min="1" max="10" value="5"><div class="speed-value" id="speedValue">5</div></div></section>
<section class="card"><div class="bottom-grid"><button class="stop" id="stopBtn">■ &nbsp; EMERGENCY STOP</button><button class="servo" id="servo90Btn">ALL SERVOS 90°</button><button id="disconnectBtn">DISCONNECT</button></div></section>
<p class="note">Bluetooth requires HTTPS and a compatible browser (Chrome on Android).<br>Firmware must implement the same command protocol before movement controls work.</p>
</div>
<script>
// BLE UUIDs configured for the SpiderBot firmware (must match the ESP32 firmware).
const SERVICE_UUID='7b6a0001-8f2d-4c9a-a3b1-5e7d9f100001';
const RX_UUID='7b6a0002-8f2d-4c9a-a3b1-5e7d9f100001';
const TX_UUID='7b6a0003-8f2d-4c9a-a3b1-5e7d9f100001';
let bleDevice=null,bleServer=null,rxCharacteristic=null,txCharacteristic=null;
const statusText=document.getElementById('statusText'),statusDot=document.getElementById('statusDot');
function setStatus(text,connected=false){statusText.textContent=text;statusDot.classList.toggle('connected',connected);}
function buildCommand(action,parameters={}){return {device:'spider_bot',id:Date.now(),action,source:'manual',parameters};}
// Central protocol function: JSON payload is a placeholder until matching firmware handlers are installed.
async function sendCommand(action,parameters={}){
 if(!rxCharacteristic){console.warn('BLE not connected; skipped',action);return;}
 const payload=JSON.stringify(buildCommand(action,parameters));
 try{await rxCharacteristic.writeValue(new TextEncoder().encode(payload));console.log('Sent:',payload)}catch(err){console.error(err);setStatus('Send failed');}
}
async function connectBLE(){
 if(!navigator.bluetooth){alert('Web Bluetooth is not supported in this browser. Try Chrome on Android.');return;}
 try{setStatus('Choose SpiderBot…');bleDevice=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE_UUID]}],optionalServices:[SERVICE_UUID]});
 bleDevice.addEventListener('gattserverdisconnected',()=>{rxCharacteristic=null;txCharacteristic=null;setStatus('Disconnected');});
 bleServer=await bleDevice.gatt.connect();const service=await bleServer.getPrimaryService(SERVICE_UUID);
 rxCharacteristic=await service.getCharacteristic(RX_UUID);try{txCharacteristic=await service.getCharacteristic(TX_UUID);if(txCharacteristic.properties.notify){await txCharacteristic.startNotifications();}}catch(e){console.info('TX characteristic optional/not available',e)}
 setStatus('Connected to '+(bleDevice.name||'SpiderBot'),true);document.getElementById('connectBtn').textContent='CONNECTED';
 }catch(e){console.error(e);setStatus(e.name==='NotFoundError'?'No device selected':'Connection failed');}
}
async function disconnectBLE(){if(bleDevice?.gatt?.connected)bleDevice.gatt.disconnect();rxCharacteristic=null;txCharacteristic=null;setStatus('Disconnected');document.getElementById('connectBtn').textContent='CONNECT BLE';}
document.getElementById('connectBtn').addEventListener('click',connectBLE);document.getElementById('disconnectBtn').addEventListener('click',disconnectBLE);
document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>sendCommand(btn.dataset.action)));
const speed=document.getElementById('speed');speed.addEventListener('input',()=>{document.getElementById('speedValue').textContent=speed.value;sendCommand('set_speed',{speed:Number(speed.value)});});
document.getElementById('stopBtn').addEventListener('click',()=>sendCommand('stop'));
document.getElementById('servo90Btn').addEventListener('click',()=>sendCommand('all_servos_90'));
// Directional buttons: issue an immediate movement, repeat while held, and STOP on release.
const movementButtons=document.querySelectorAll('[data-move]');let heldMove=null,repeatTimer=null;const repeatIntervalMs=1200;
function stopHeldMove(){if(repeatTimer){clearInterval(repeatTimer);repeatTimer=null;}heldMove=null;sendCommand('stop');}
function startHeldMove(btn){const action=btn.dataset.move;if(heldMove===action)return;stopHeldMove();heldMove=action;sendCommand(action,{speed:Number(speed.value)});repeatTimer=setInterval(()=>{if(heldMove===action)sendCommand(action,{speed:Number(speed.value)});},repeatIntervalMs);}
movementButtons.forEach(btn=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);startHeldMove(btn);});btn.addEventListener('pointerup',e=>{e.preventDefault();stopHeldMove();});btn.addEventListener('pointercancel',stopHeldMove);btn.addEventListener('lostpointercapture',stopHeldMove);btn.addEventListener('contextmenu',e=>e.preventDefault());});
document.getElementById('stopPadBtn').addEventListener('click',stopHeldMove);document.getElementById('stopBtn').addEventListener('click',stopHeldMove);
</script>
</body>
</html>
